name: VNews CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    # windows-latest ships with SQL Server LocalDB preinstalled, matching the local dev stack
    # (VNews uses SQL Server, not SQLite/in-memory, per project requirements).
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ensure LocalDB instance is running
        run: sqllocaldb start MSSQLLocalDB
        shell: powershell

      - name: Restore
        run: dotnet restore VNews.slnx

      - name: Build
        run: dotnet build VNews.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VNews.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
